# Secret scan for this public repository (N436). Personal material never goes
# in here: no SSH keys of any kind, no private keys, no certificates. Host
# playbooks with real keys and CAs stay local (configure-*.yml is gitignored).
title = "os-tools secret scan (N436)"

[extend]
useDefault = true

[[rules]]
id = "ssh-public-key"
description = "SSH public key (OpenSSH format)"
regex = '''(?:ssh-(?:rsa|dss|ed25519)|ecdsa-sha2-nistp(?:256|384|521)|sk-ssh-ed25519@openssh\.com|sk-ecdsa-sha2-nistp256@openssh\.com) AAAA[0-9A-Za-z+/]{40,}={0,3}'''
keywords = ["ssh-", "ecdsa-sha2-", "sk-"]

[[rules]]
id = "ssh2-public-key"
description = "SSH public key (RFC 4716 format)"
regex = '''---- BEGIN SSH2 PUBLIC KEY ----'''
keywords = ["begin ssh2 public key"]

[[rules]]
id = "pem-certificate"
description = "Certificate body (placeholders such as 'root certificate' are fine)"
regex = '''-----BEGIN CERTIFICATE-----[\s#"'+]*MII[A-Za-z0-9+/]{30,}'''
keywords = ["begin certificate"]
