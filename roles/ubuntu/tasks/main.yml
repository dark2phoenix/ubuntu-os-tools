---
# -------- package management
- name: Manage apt packages
  ansible.builtin.include_tasks: apt.yml
- name: Install Python tooling
  ansible.builtin.include_tasks: pip.yml

# -------- docker setup
- name: Install and configure Docker
  ansible.builtin.include_tasks: docker.yml

# -------- log forwarding support
- name: Forward syslog to the remote server
  ansible.builtin.include_tasks: logstash.yml
  when: syslog_remote_server | default('', true) | length > 0

# -------- firewall (ufw)
- name: Configure the ufw firewall
  ansible.builtin.include_tasks: firewall.yml

# -------- configure timesync
- name: Configure time sync
  ansible.builtin.include_tasks: timesync.yml

# -------- Install local ssl root certificate
- name: Install the local root certificate
  ansible.builtin.include_tasks: certificates.yml
  when: ssl_root_certificate_pem | default('', true) | length > 0

# -------- default user operations
- name: Configure users
  ansible.builtin.include_tasks: users.yml
