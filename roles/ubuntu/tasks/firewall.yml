#
# Firewall through ufw, Ubuntu's own front end. Rules persist in ufw's own
# configuration, and ufw's defaults already allow loopback, established
# connections and ping.
#
# The ufw command is used directly because the ufw Ansible module lives in
# the community.general collection, and this role uses ansible.builtin only.
# Existing ufw rules on the host are left in place; this only adds, unless
# force_reset_firewall is true, which rebuilds ufw from firewall_allowed_ports.
#
---
- name: Install ufw
  ansible.builtin.apt:
    name: ufw
    state: present

# A reset rebuilds ufw from firewall_allowed_ports alone, so a list without
# SSH would cut off remote access once ufw is enabled again.
- name: Refuse to reset the firewall without SSH
  ansible.builtin.assert:
    that:
      - firewall_allowed_ports | map('string') | select('match', '^(22(/tcp)?|ssh|OpenSSH)$') | list | length > 0
    fail_msg: >-
      force_reset_firewall is set but firewall_allowed_ports has no 22/tcp, so
      the rebuilt firewall would block SSH. Add 22/tcp to firewall_allowed_ports.
    quiet: true
  when: force_reset_firewall | bool

# Deletes every ufw rule (ufw keeps timestamped backups of its rule files) and
# disables ufw; the tasks below add firewall_allowed_ports and enable it again.
- name: Reset ufw (force_reset_firewall)
  ansible.builtin.command: ufw --force reset
  changed_when: true
  when: force_reset_firewall | bool

- name: Allow inbound ports through ufw
  ansible.builtin.command: ufw allow {{ item | quote }}
  register: firewall_ufw_allow
  changed_when: "'Skipping' not in firewall_ufw_allow.stdout"
  loop: "{{ firewall_allowed_ports }}"

- name: Read ufw state
  ansible.builtin.command: ufw status
  register: firewall_ufw_status
  changed_when: false
  check_mode: false

# Only after the allow rules, so enabling can't cut off SSH.
- name: Enable ufw
  ansible.builtin.command: ufw --force enable
  changed_when: true
  when: "'Status: active' not in firewall_ufw_status.stdout"

# Earlier versions saved raw iptables rules here; nothing ever restored them.
- name: Remove the old saved iptables rules
  ansible.builtin.file:
    path: /etc/iptables.rules
    state: absent
