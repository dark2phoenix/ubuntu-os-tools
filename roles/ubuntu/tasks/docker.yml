---
# Docker from the Ubuntu archive (docker.io, docker-compose-v2), updated by
# ordinary apt like every other package, the way the Photon role uses Photon's
# own docker package. Earlier versions of this role installed Docker Inc.'s
# docker-ce from a repository hard-coded to jammy (22.04), which froze on any
# host upgraded to a later release.

- name: Check for Docker Inc.'s docker-ce
  ansible.builtin.command: dpkg-query -W -f=${Status} docker-ce
  register: docker_ce_status
  changed_when: false
  failed_when: false
  check_mode: false

# Removing docker-ce stops the engine and every container on the host.
# Images, containers and volumes in /var/lib/docker are kept (remove, not
# purge), and docker.io uses the same directory.
- name: Stop before replacing docker-ce unless that was asked for
  ansible.builtin.fail:
    msg: >-
      docker-ce is installed. Replacing it with the Ubuntu docker.io package stops every
      container on this host. Stop the workloads, then re-run with
      docker_replace_docker_ce=true.
  when:
    - "'install ok installed' in docker_ce_status.stdout"
    - not (docker_replace_docker_ce | bool)

- name: Remove Docker Inc.'s packages
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - docker-ce-rootless-extras
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: absent
  when: "'install ok installed' in docker_ce_status.stdout"

- name: Remove Docker Inc.'s apt sources and signing key
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/docker.list
    - /etc/apt/sources.list.d/docker.list.distUpgrade
    - /etc/apt/sources.list.d/docker.sources
    - /etc/apt/sources.list.d/download_docker_com_linux_ubuntu.list
    - /etc/apt/keyrings/docker.asc
    - /etc/apt/keyrings/docker.gpg

- name: Install Docker from the Ubuntu archive
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose-v2
      - docker-buildx
    state: present
    update_cache: true

- name: Create docker group
  ansible.builtin.group:
    name: docker
    gid: "{{ docker_group_id }}"
    state: present

- name: Create a docker user
  ansible.builtin.user:
    name: docker
    uid: "{{ docker_user_id }}"
    shell: /bin/bash
    groups:
      - docker
    append: true
    expires: -1
    password_expire_max: -1

# Use a systemd drop-in rather than editing the packaged unit in
# /usr/lib/systemd/system, which is overwritten on every docker package update.
- name: Create docker.service drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/docker.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Run the docker service with the docker group
  ansible.builtin.copy:
    dest: /etc/systemd/system/docker.service.d/group.conf
    content: |
      # Managed by Ansible (ubuntu role)
      [Service]
      Group=docker
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload unit files
    - Restart docker

- name: Create Docker configuration folder
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    mode: "0755"
    owner: root
    group: root

- name: Check for an existing daemon.json
  ansible.builtin.stat:
    path: /etc/docker/daemon.json
  register: docker_daemon_json

# Seeded once: an existing daemon.json (hand-edited, or maintained by another
# tool) is left alone unless force_reset_docker_config is true. Insecure
# registries are set through daemon.json (see daemon.json.j2).
- name: Configure docker daemon.json
  ansible.builtin.template:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json
    mode: "0644"
    owner: root
    group: root
    force: "{{ force_reset_docker_config | bool }}"
    backup: true
  notify: Restart docker

- name: Report that daemon.json was left unchanged
  ansible.builtin.debug:
    msg: >-
      /etc/docker/daemon.json already exists and was left unchanged.
      To replace it with docker_daemon_config from this playbook,
      set force_reset_docker_config: true.
  when:
    - docker_daemon_json.stat.exists
    - not (force_reset_docker_config | bool)

- name: Set Docker start and run at boot
  ansible.builtin.systemd_service:
    name: docker
    state: started
    enabled: true
