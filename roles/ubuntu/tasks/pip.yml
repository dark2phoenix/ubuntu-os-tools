---
# Install from apt rather than pip: Ubuntu 23.04 and later mark the system
# Python as externally managed (PEP 668), so a system-wide pip install fails.
- name: Install python3 pip and virtualenv via apt
  ansible.builtin.apt:
    name:
      - python3-pip
      - python3-virtualenv
    state: present
