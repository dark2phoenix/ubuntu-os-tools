---
- name: Ensure OpenSSL and ca-certificates are installed
  ansible.builtin.apt:
    name:
      - openssl
      - ca-certificates
    state: present

# update-ca-certificates only reads *.crt files under
# /usr/local/share/ca-certificates. A file dropped straight into
# /etc/ssl/certs (as this role used to) never reaches the system bundle.
- name: Copy root certificate to the local CA store
  ansible.builtin.copy:
    content: "{{ ssl_root_certificate_pem }}"
    dest: "/usr/local/share/ca-certificates/{{ ssl_root_certificate_pem_filename | regex_replace('[.](pem|crt)$', '') }}.crt"
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Update CA certificates
