---
- name: Reload unit files
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart syslog-ng
  ansible.builtin.systemd_service:
    name: syslog-ng
    state: restarted
    enabled: true

- name: Restart journald
  ansible.builtin.systemd_service:
    name: systemd-journald
    state: restarted
    enabled: true

- name: Restart docker
  ansible.builtin.systemd_service:
    name: docker
    state: restarted
    enabled: true

- name: Restart systemd-timesyncd
  ansible.builtin.systemd_service:
    name: systemd-timesyncd.service
    state: restarted
  listen: systemd-timesyncd configuration changed

- name: Write adjtime
  ansible.builtin.command: hwclock --systohc
  changed_when: true
  when: ansible_facts['virtualization_role'] == "host" or ansible_facts['virtualization_role'] == "NA"
  listen: systemd-timesyncd configuration changed

- name: Update CA certificates
  ansible.builtin.command: /usr/sbin/update-ca-certificates
  changed_when: true
